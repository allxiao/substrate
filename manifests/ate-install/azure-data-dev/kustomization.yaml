apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
patches:
- path: identity.yaml
- target:
    group: monitoring.googleapis.com
    version: v1
    kind: PodMonitoring
  patch: |-
    apiVersion: monitoring.googleapis.com/v1
    kind: PodMonitoring
    metadata:
      name: atenet-router-envoy
      namespace: ate-system
    $patch: delete
- target:
    group: apps
    version: v1
    kind: DaemonSet
    labelSelector: app=atelet
  patch: |-
    - op: remove
      path: /spec/template/spec/containers/0/args/0
    - op: remove
      path: /spec/template/spec/containers/0/args/0
    - op: test
      path: /spec/template/spec/containers/0/volumeMounts/8/name
      value: image-credential-provider-config
    - op: remove
      path: /spec/template/spec/containers/0/volumeMounts/8
    - op: test
      path: /spec/template/spec/containers/0/volumeMounts/7/name
      value: image-credential-provider-bin
    - op: remove
      path: /spec/template/spec/containers/0/volumeMounts/7